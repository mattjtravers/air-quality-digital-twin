# @spec PIPE-SCHED-001, PIPE-SCHED-003, PIPE-SCHED-004, PIPE-SCHED-005, PIPE-SCHED-006, PIPE-SCHED-007, PIPE-SCHED-008, PIPE-SCHED-009, PIPE-CFG-001
# Dispatched by an AWS EventBridge schedule (infra/dispatch) or by hand; there is no other
# trigger. Runners have no PostGIS: the archive is the output.
name: calibrate-fit

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "Fit as_of (ISO 8601 UTC); empty = the most recent 00:00 UTC"
        required: false
        type: string

concurrency:
  group: calibrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install the project
        run: uv sync --no-dev

      - name: calibrate-fit
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
          AQDT_ARCHIVE_URI: ${{ vars.AQDT_ARCHIVE_URI }}
        run: |
          uv run aqdt calibrate fit \
            ${{ inputs.as_of && format('--as-of {0}', inputs.as_of) || '' }}
