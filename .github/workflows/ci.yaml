name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-24.04  # @spec PIPE-SCHED-010

    # @spec OBS-ENV-007
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: aqdt
          POSTGRES_PASSWORD: aqdt
          POSTGRES_DB: aqdt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aqdt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://aqdt:aqdt@localhost:5432/aqdt

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: "pyproject.toml"

    - name: Install dependencies
      run: uv sync --all-groups

    - name: Run Linter
      run: uv run ruff check .

    - name: Run Tests
      run: uv run pytest
